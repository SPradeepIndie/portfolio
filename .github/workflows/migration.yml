name: Database Migration

on:
  workflow_call:
    secrets:
      DB_PASSWORD:
        required: true

jobs:
  migrate:
    name: Run backend migrations
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check DB_PORT and env
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
        run: |
          set -euo pipefail
          echo "DB_HOST=${DB_HOST:-<not set>}"
          echo "DB_NAME=${DB_NAME:-<not set>}"
          echo "DB_USER=${DB_USER:-<not set>}"
          # Show raw bytes and length to detect hidden characters
          printf 'DB_PORT raw: '%s'\n' "${DB_PORT:-<not set>}"
          printf 'DB_PORT length: %d\n' "${#DB_PORT}"
          # Show hex of DB_PORT to reveal non-digit characters
          if [ -n "${DB_PORT:-}" ]; then
            echo -n "DB_PORT hex: "
            printf '%s' "$DB_PORT" | xxd -p | tr -d '\n' || true
            echo
          fi
          if [ -z "${DB_PORT:-}" ]; then
            echo "DB_PORT is empty" >&2
            exit 1
          fi
          if ! printf '%s' "$DB_PORT" | grep -Eq '^[0-9]+$'; then
            echo "DB_PORT must be numeric. Current value:'$DB_PORT'" >&2
            exit 1
          fi

      - name: Run production migrations
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: npm run migrate:up:prod
