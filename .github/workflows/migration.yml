name: Database Migration

on:
  workflow_call:
    secrets:
      DB_PASSWORD:
        required: true

jobs:
  migrate:
    name: Run backend migrations
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # This will update the database.json file with the environment variables
      # Using github action variables for the DB_HOST, DB_PORT, DB_NAME, DB_USER
      # Using github secrets for the DB_PASSWORD
      - name: Substitute environment variables in database.json
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: node substitute-env.js
  
      #Run production migrations
      - name: Run production migrations
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: npm run migrate:up:prod
