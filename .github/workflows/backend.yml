name: Backend CI

on:
  workflow_call:
    inputs:
      push_image:
        description: Push the built image to ACR
        required: false
        type: boolean
        default: false
      image_tag:
        description: Image tag to publish
        required: true
        type: string
      acr_name:
        description: Azure Container Registry name
        required: false
        type: string
        default: ""
      acr_login_server:
        description: Azure Container Registry login server
        required: false
        type: string
        default: ""
      image_repository:
        description: Repository name for the backend image
        required: false
        type: string
        default: portfolio-backend
    secrets:
      AZURE_CREDENTIALS:
        required: false

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend checks
        run: npm test

  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.push_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ inputs.acr_name }}"

      - name: Build backend image
        working-directory: backend
        run: |
          IMAGE="${{ inputs.acr_login_server }}/${{ inputs.image_repository }}:${{ inputs.image_tag }}"
          docker build -t "$IMAGE" -f Dockerfile .

      - name: Push backend image
        run: |
          IMAGE="${{ inputs.acr_login_server }}/${{ inputs.image_repository }}:${{ inputs.image_tag }}"
          docker push "$IMAGE"
