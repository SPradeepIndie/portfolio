name: CD Orchestrator

on:
  workflow_run:
    workflows:
      - CI Orchestrator
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_migrations:
        type: boolean
        description: 'Run database migrations'
        required: false
        default: false
      deploy_backend:
        description: 'Deploy backend container app'
        type: boolean
        required: false
        default: false
      deploy_frontend:
        description: 'Deploy frontend container app'
        type: boolean
        required: false
        default: false
      tag:
        description: 'Image tag to use when pushing/deploying (optional, defaults to github.sha)'
        required: false
        default: ''

jobs:
  validate-azure-credentials:
    name: Validate Azure credentials
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_migrations == 'true' || github.event.inputs.deploy_backend == 'true' || github.event.inputs.deploy_frontend == 'true')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register required Azure resource providers
        run: |
          az provider register -n Microsoft.App --wait
          az provider register -n Microsoft.OperationalInsights --wait

      - name: Ensure Log Analytics workspace exists
        id: ensure-workspace
        run: |
          set -e
          RG=${{ vars.AZURE_RESOURCE_GROUP }}
          WORKSPACE_NAME="${{ vars.AZURE_LOG_WORKSPACE_NAME }}"
          if [ -z "$WORKSPACE_NAME" ]; then
            WORKSPACE_NAME="${RG}-log-workspace"
          fi
          LOCATION=$(az group show -n "$RG" --query location -o tsv)
          WORKSPACE_ID=$(az monitor log-analytics workspace show -g "$RG" -n "$WORKSPACE_NAME" --query id -o tsv 2>/dev/null || true)
          if [ -z "$WORKSPACE_ID" ]; then
            echo "Creating Log Analytics workspace: $WORKSPACE_NAME in $RG ($LOCATION)"
            WORKSPACE_ID=$(az monitor log-analytics workspace create -g "$RG" -n "$WORKSPACE_NAME" --location "$LOCATION" --query id -o tsv)
          else
            echo "Found existing workspace: $WORKSPACE_NAME"
          fi
          echo "WORKSPACE_ID=$WORKSPACE_ID" >> $GITHUB_ENV

      - name: Ensure Container Apps environment exists
        run: |
          set -e
          RG=${{ vars.AZURE_RESOURCE_GROUP }}
          ENV_NAME=${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}
          LOCATION=$(az group show -n "$RG" --query location -o tsv)
          if az containerapp env show -g "$RG" -n "$ENV_NAME" >/dev/null 2>&1; then
            echo "Container Apps environment $ENV_NAME already exists"
          else
            echo "Creating Container Apps environment $ENV_NAME with logs workspace"
            WORKSPACE_ID=${WORKSPACE_ID:-$(az monitor log-analytics workspace show -g "$RG" -n "${RG}-log-workspace" --query id -o tsv)}
            az containerapp env create -g "$RG" -n "$ENV_NAME" --logs-workspace-id "$WORKSPACE_ID" --location "$LOCATION"
          fi

      - name: Verify Azure session
        run: az account show

  migrations:
    name: Run database migrations
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true') }}
    needs:
      - validate-azure-credentials
    uses: ./.github/workflows/migration.yml
    secrets: inherit

  deploy-backend:
    name: Deploy backend container app
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true') }}
    needs:
      - migrations
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register required Azure resource providers
        run: |
          az provider register -n Microsoft.App --wait
          az provider register -n Microsoft.OperationalInsights --wait

      - name: Ensure Log Analytics workspace exists
        id: ensure-workspace-frontend
        run: |
          set -e
          RG=${{ vars.AZURE_RESOURCE_GROUP }}
          WORKSPACE_NAME="${{ vars.AZURE_LOG_WORKSPACE_NAME }}"
          if [ -z "$WORKSPACE_NAME" ]; then
            WORKSPACE_NAME="${RG}-log-workspace"
          fi
          LOCATION=$(az group show -n "$RG" --query location -o tsv)
          WORKSPACE_ID=$(az monitor log-analytics workspace show -g "$RG" -n "$WORKSPACE_NAME" --query id -o tsv 2>/dev/null || true)
          if [ -z "$WORKSPACE_ID" ]; then
            echo "Creating Log Analytics workspace: $WORKSPACE_NAME in $RG ($LOCATION)"
            WORKSPACE_ID=$(az monitor log-analytics workspace create -g "$RG" -n "$WORKSPACE_NAME" --location "$LOCATION" --query id -o tsv)
          else
            echo "Found existing workspace: $WORKSPACE_NAME"
          fi
          echo "WORKSPACE_ID=$WORKSPACE_ID" >> $GITHUB_ENV

      - name: Ensure Container Apps environment exists
        run: |
          set -e
          RG=${{ vars.AZURE_RESOURCE_GROUP }}
          ENV_NAME=${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}
          LOCATION=$(az group show -n "$RG" --query location -o tsv)
          if az containerapp env show -g "$RG" -n "$ENV_NAME" >/dev/null 2>&1; then
            echo "Container Apps environment $ENV_NAME already exists"
          else
            echo "Creating Container Apps environment $ENV_NAME with logs workspace"
            WORKSPACE_ID=${WORKSPACE_ID:-$(az monitor log-analytics workspace show -g "$RG" -n "${RG}-log-workspace" --query id -o tsv)}
            az containerapp env create -g "$RG" -n "$ENV_NAME" --logs-workspace-id "$WORKSPACE_ID" --location "$LOCATION"
          fi

      - name: Deploy backend container app
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/portfolio-backend:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.tag || github.sha }}
          acrName: ${{ vars.ACR_NAME }}
          containerAppName: backend
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}
          ingress: internal
          targetPort: 5000
          environmentVariables: NODE_ENV=production

  deploy-frontend:
    name: Deploy frontend container app
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend == 'true') }}
    needs: 
      - validate-azure-credentials
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy frontend container app
        uses: azure/container-apps-deploy-action@v1
        with:
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/portfolio-frontend:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.tag || github.sha }}
          acrName: ${{ vars.ACR_NAME }}
          containerAppName: frontend
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}
          ingress: external
          targetPort: 80
