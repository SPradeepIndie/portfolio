properties:
  managedEnvironmentId: ${CONTAINER_APP_ENVIRONMENT_ID}
  configuration:
    ingress:
      external: true
      allowInsecure: false
      transport: auto
      targetPort: 5000
    secrets:
      - name: acr-password-secret
        value: ${ACR_PASSWORD}
      - name: db-password-secret
        value: ${DB_PASSWORD}
      - name: azure-storage-connection-string
        value: ${AZURE_STORAGE_CONNECTION_STRING}
    registries:
      - server: ${ACR_LOGIN_SERVER}
        username: ${ACR_USERNAME}
        passwordSecretRef: acr-password-secret
  template:
    containers:
      - name: backend
        image: ${REGISTRY_IMAGE}
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: DB_HOST
            value: ${DB_HOST}
          - name: DB_PORT
            value: ${DB_PORT}
          - name: DB_NAME
            value: ${DB_NAME}
          - name: DB_USER
            value: ${DB_USER}
          - name: DB_PASSWORD
            secretRef: db-password-secret
          - name: AZURE_STORAGE_CONNECTION_STRING
            secretRef: azure-storage-connection-string
          - name: AZURE_BLOB_CONTAINER_NAME
            value: ${AZURE_BLOB_CONTAINER_NAME}
    scale:
      minReplicas: 1
      maxReplicas: 2
      rules:
        - name: http-requests
          http:
            metadata:
              concurrentRequests: '100'
